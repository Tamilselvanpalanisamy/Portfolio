<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">URL Shortener application preview</title>
  <desc id="desc">A URL Shortener interface showing a long URL, a shortened link, and access statistics.</desc>
  <rect width="900" height="560" rx="24" fill="#101827"/>
  <rect x="32" y="32" width="836" height="496" rx="18" fill="#172235" stroke="#334155" stroke-width="2"/>
  <circle cx="68" cy="70" r="8" fill="#f87171"/>
  <circle cx="96" cy="70" r="8" fill="#fbbf24"/>
  <circle cx="124" cy="70" r="8" fill="#34d399"/>
  <text x="68" y="138" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">URL Shortener</text>
  <text x="68" y="171" fill="#94a3b8" font-family="Arial, sans-serif" font-size="17">Turn long links into simple, shareable URLs.</text>
  <rect x="68" y="207" width="590" height="62" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text x="92" y="245" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">https://example.com/products/software</text>
  <rect x="674" y="207" width="158" height="62" rx="10" fill="#2563eb"/>
  <text x="753" y="245" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Shorten URL</text>
  <rect x="68" y="309" width="764" height="106" rx="12" fill="#0f172a" stroke="#1d4ed8" stroke-width="2"/>
  <text x="94" y="343" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">YOUR SHORT LINK</text>
  <text x="94" y="382" fill="#60a5fa" font-family="Arial, sans-serif" font-size="25" font-weight="700">127.0.0.1:5000/a8F3kL</text>
  <rect x="690" y="343" width="112" height="42" rx="8" fill="#1e3a8a"/>
  <text x="746" y="369" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="14" font-weight="700">COPY LINK</text>
  <text x="68" y="465" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">SQLite database</text>
  <text x="294" y="465" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">Unique hash</text>
  <text x="500" y="465" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">Access count: 24</text>
</svg>
